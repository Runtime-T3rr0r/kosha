<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosha approvals</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --text: #d4d4d4; --muted: #9d9d9d;
    --accent: #3794ff; --ok: #4ec9b0; --warn: #d7ba7d; --danger: #f48771;
    --l0: #6a6a6a; --l2: #4ec9b0; --l3: #d7ba7d; --l4: #ce9178; --l5: #f14c4c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --panel: #f3f3f3; --border: #d0d0d0; --text: #1f1f1f; --muted: #616161;
            --accent: #005fb8; --ok: #16825d; --warn: #8a6d00; --danger: #c72e0f;
            --l0: #8a8a8a; --l2: #16825d; --l3: #8a6d00; --l4: #b35900; --l5: #c72e0f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0; }
  .status { color: var(--muted); font-size: 12px; }
  .status.live::before { content: "● "; color: var(--ok); }
  .status.down::before { content: "● "; color: var(--danger); }
  .lock { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input { background: var(--panel); color: var(--text); border: 1px solid var(--border);
          border-radius: 3px; padding: 5px 7px; font: inherit; }
  input:focus { outline: 1px solid var(--accent); }
  button { font: inherit; border: 1px solid var(--border); border-radius: 3px; padding: 5px 10px;
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.approve { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.deny { color: var(--danger); }
  .msg { font-size: 12px; margin: 6px 0 0; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  #done { white-space: pre-line; margin: 0 0 12px; }
  .empty { color: var(--muted); padding: 24px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
          padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .rule { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--warn);
          border: 1px solid var(--warn); border-radius: 3px; padding: 0 5px; }
  .held { font-family: ui-monospace, "SF Mono", Consolas, monospace; overflow-wrap: anywhere; }
  .reason { color: var(--muted); margin: 4px 0 8px; }
  .spend { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  ol { margin: 0 0 10px; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  li { display: grid; grid-template-columns: 9.5em 2.6em 1fr; gap: 6px; padding: 3px 0;
       border-bottom: 1px solid var(--border); font-size: 12px; align-items: baseline; }
  li.pending { font-weight: 600; }
  li .what { font-family: ui-monospace, "SF Mono", Consolas, monospace; overflow-wrap: anywhere; }
  .lvl { font-size: 11px; text-align: center; border-radius: 3px; color: #fff; padding: 0 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .actions input { flex: 1 1 10em; min-width: 8em; }
</style>
</head>
<body>
<header>
  <h1>Kosha approvals</h1>
  <span id="conn" class="status">connecting…</span>
</header>

<div class="lock">
  <input id="pass" type="password" placeholder="Approval passphrase" autocomplete="off">
  <button id="unlock">Unlock</button>
  <span id="lockmsg" class="status">Needed to approve or deny. Kept in this page only.</span>
</div>

<p id="done" class="msg ok" aria-live="polite"></p>
<main id="list"><p class="empty">Loading…</p></main>

<script>
"use strict";
// Everything agent-written (commands, SQL, paths, notes) is inserted with textContent,
// never as HTML: an agent must not be able to inject script into the approval page.
let passphrase = null;                       // in page memory only, never stored
const $ = (id) => document.getElementById(id);
const LEVEL_COLORS = ["--l0", "--l0", "--l2", "--l3", "--l4", "--l5"];

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c);
  return n;
}

function what(e) {
  const raw = e.raw || {};
  if (e.argv && e.argv.length) return e.argv.join(" ");
  return String(raw.sql || raw.path || raw.command || raw.args || raw.target || "");
}

function levelBadge(level) {
  const b = el("span", { class: "lvl", text: "L" + level });
  b.style.background = `var(${LEVEL_COLORS[Math.max(0, Math.min(5, level))] || "--l0"})`;
  return b;
}

async function spendLine(sessionId) {
  try {
    const s = await (await fetch(`/sessions/${encodeURIComponent(sessionId)}`)).json();
    if (!s.fleet) return null;
    const agents = Object.entries(s.agents || {}).map(([a, v]) => `${a} ${v.spent}`).join(" · ");
    return el("div", { class: "spend", text: `Fleet ${s.fleet.spent}/${s.fleet.budget} this window · ${agents}` });
  } catch { return null; }
}

async function decide(ap, decision, note, msgEl, buttons) {
  if (!passphrase) { msgEl.className = "msg err"; msgEl.textContent = "Unlock with the passphrase first."; return; }
  buttons.forEach((b) => (b.disabled = true));
  try {
    const r = await fetch(`/approvals/${ap.id}`, {
      method: "POST",
      headers: { "content-type": "application/json", "X-Kosha-Approval": passphrase },
      body: JSON.stringify({ decision, note: note || null }),
    });
    if (r.status === 401) {
      passphrase = null; setLocked();
      msgEl.className = "msg err"; msgEl.textContent = "Wrong passphrase. Unlock again.";
      buttons.forEach((b) => (b.disabled = false));
      return;
    }
    const out = await r.json();
    // kept above the list: the card itself disappears on the next refresh
    const line = decision === "deny"
      ? `#${ap.id} denied (${ap.agent_id}). That call will not run.`
      : `#${ap.id} ${out.status} (${ap.agent_id}). Its waiting call runs now.`;
    $("done").textContent = [line, ...$("done").textContent.split("\n").filter(Boolean)].slice(0, 4).join("\n");
    setTimeout(refresh, 300);
  } catch (e) {
    msgEl.className = "msg err"; msgEl.textContent = "Kosha is not responding.";
    buttons.forEach((b) => (b.disabled = false));
  }
}

async function card(ap) {
  const held = ap.bundle[ap.bundle.length - 1] || {};
  const c = el("section", { class: "card" });
  c.append(el("h2", {}, el("span", { text: `#${ap.id} held` }), ap.rule ? el("span", { class: "rule", text: ap.rule }) : null,
                        el("span", { text: `${ap.agent_id} · ${held.tool || ""}` })));
  c.append(el("div", { class: "held", text: what(held) }));
  if (ap.reason) c.append(el("p", { class: "reason", text: ap.reason + (ap.suggestion ? " " + ap.suggestion : "") }));
  const spend = await spendLine(ap.session_id);
  if (spend) c.append(spend);
  const list = el("ol");
  for (const e of ap.bundle) {
    list.append(el("li", { class: e.status === "pending" ? "pending" : "" },
      el("span", { text: e.agent_id }), levelBadge(e.level ?? 0),
      el("span", { class: "what", text: `${e.tool}  ${what(e)}${e.status === "pending" ? "  ← held" : ""}` })));
  }
  c.append(el("div", { class: "status", text: "This window, in order:" }), list);
  const note = el("input", { placeholder: "Note (optional, e.g. why denied)" });
  const once = el("button", { class: "approve", text: "Approve once" });
  const reset = el("button", { text: "Approve & reset window" });
  const deny = el("button", { class: "deny", text: "Deny" });
  const msg = el("p", { class: "msg" });
  const buttons = [once, reset, deny];
  once.onclick = () => decide(ap, "approve_once", note.value, msg, buttons);
  reset.onclick = () => decide(ap, "approve_reset", note.value, msg, buttons);
  deny.onclick = () => decide(ap, "deny", note.value, msg, buttons);
  buttons.forEach((b) => (b.disabled = !passphrase));
  c.append(el("div", { class: "actions" }, once, reset, deny, note), msg);
  return c;
}

let refreshing = false;
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    const pending = await (await fetch("/approvals")).json();
    const cards = await Promise.all(pending.map(card));
    $("list").replaceChildren(...(cards.length ? cards : [el("p", { class: "empty", text: "Nothing is held. Agents are running within budget." })]));
    $("conn").className = "status live"; $("conn").textContent = "live";
  } catch {
    $("conn").className = "status down"; $("conn").textContent = "koshad not responding";
  } finally { refreshing = false; }
}

function setLocked() {
  $("lockmsg").textContent = passphrase ? "Unlocked for this page." : "Needed to approve or deny. Kept in this page only.";
  document.querySelectorAll(".actions button").forEach((b) => (b.disabled = !passphrase));
}

$("unlock").onclick = () => { passphrase = $("pass").value || null; $("pass").value = ""; setLocked(); };
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("unlock").click(); });

// live: refresh when koshad reports approval activity; poll as a fallback
try {
  const events = new EventSource("/stream");
  for (const t of ["approval_requested", "approval_resolved", "action_reserved", "action_confirmed", "action_cancelled"])
    events.addEventListener(t, () => refresh());
  events.onerror = () => { $("conn").className = "status down"; $("conn").textContent = "reconnecting…"; };
} catch {}
setInterval(refresh, 5000);
refresh();
</script>
</body>
</html>
