# --- file edits / writes ---
- id: file_write_tracked_clean
  match: {family: file_write, sub: tracked_clean, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: false
  note: "tracked + committed file in repo; git restore recovers it"
- id: file_write_untracked
  match: {family: file_write, sub: untracked, flags_any: []}
  reversible: false
  scope: local
  privilege: false
  read_only: false
  note: "untracked file in repo; no prior state to restore"
- id: file_write_outside_workspace
  match: {family: file_write, sub: outside_workspace, flags_any: []}
  reversible: false
  scope: shared
  privilege: false
  read_only: false
  note: "write outside repo/workspace, e.g. ../shared_lib"
- id: mkdir
  match: {family: mkdir, sub: null, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: false
  note: "creates a directory; rmdir undoes it"
# sed -i / cp / mv: the parser matches the untracked variant; a resolver lowers it to
# *_tracked_clean only when every path in the match's write_paths is tracked and clean
# (cp: the destination; mv: destination and sources). `tee FILE` is a redirect-family
# write and matches file_write_untracked; `make` matches opaque_script.
- id: sed_inplace_tracked_clean
  match: {family: sed, sub: tracked_clean, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: false
  note: "sed -i on tracked + committed files; git restore recovers them, same as an edit"
- id: sed_inplace_untracked
  match: {family: sed, sub: untracked, flags_any: []}
  reversible: false
  scope: local
  privilege: false
  read_only: false
  note: "sed -i on untracked (or unresolved) files; no prior state to restore. sed without -i only prints and stays unknown for now"
- id: cp_tracked_clean
  match: {family: cp, sub: tracked_clean, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: false
  note: "overwrites a tracked + committed destination; git restore recovers it"
- id: cp_untracked
  match: {family: cp, sub: untracked, flags_any: []}
  reversible: false
  scope: local
  privilege: false
  read_only: false
  note: "destination untracked, new, or unresolved; an overwritten untracked file is gone"
- id: mv_tracked_clean
  match: {family: mv, sub: tracked_clean, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: false
  note: "sources and destination tracked + committed; git restore recovers both ends"
- id: mv_untracked
  match: {family: mv, sub: untracked, flags_any: []}
  reversible: false
  scope: local
  privilege: false
  read_only: false
  note: "any end untracked, new, or unresolved; an overwritten untracked destination is gone"
- id: tee_stdout
  match: {family: shell, sub: tee, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: true
  note: "tee with no file operand (or only /dev/null) just passes input through"

