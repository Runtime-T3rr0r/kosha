# effects.yaml: command/tool pattern -> effect axes (reversible, scope, privilege).
#
# match.family  command family recognized by the parser (git, rm, sql, kubectl, ...)
#               or a file-tool family (file_write) for edit/write tool calls.
# match.sub     subcommand, statement type, or the context class a resolver assigns
#               (tracked_clean | untracked | outside_workspace, local | shared db).
# match.flags_any  entry matches if any of these tokens is present; [] = no flag condition.
# scope         local | shared | external | resolve
# read_only     true = no effect at all (listing, reading, querying); classifies L0 via
#               classify_action(read_only=True) and prices 0. Required on every entry.
#
# Level comes from the rubric, not from this file. Unrecognized commands fall through
# to `unknown` (conservative default).

# --- read-only ---
- id: ls
  match: {family: fs_read, sub: ls, flags_any: []}
  reversible: true
  scope: local
  privilege: false
  read_only: true
  note: "read-only listing"
- id: cat_nonsecret
  match: {family: fs_read, sub: cat, flags_any: []}
  reversible: true
