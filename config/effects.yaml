# --- opaque scripts ---
# Flat fallback for python <file>, bash|sh <file>, npm run <script>, npm|yarn|pnpm test,
# make: effects are hidden inside the script, so it is charged a fixed irrev|local
# cell. Scanning short scripts (< ~300 lines) for their real effects is not built yet.
- id: opaque_script
  match: {family: script, sub: opaque, flags_any: []}
  reversible: false
  scope: local
  privilege: false
  read_only: false
  note: "opaque local script; flat fallback, contents not scanned"

# --- resource hijacking ---
# Only the unambiguous cases. nc, base64, xclip, tar, dd, sysctl, prisma migrate,
# python -c, node -e are deliberately not classified: argv alone can't distinguish
# benign use from misuse, so they stay unknown.
- id: crypto_miner
  match: {family: hijack, sub: miner, flags_any: []}
  reversible: false
  scope: external
  privilege: false
  read_only: false
  note: "xmrig, any invocation: burns compute and connects to an external mining pool"
- id: stress_load
  match: {family: hijack, sub: stress, flags_any: []}
  reversible: false
  scope: shared
  privilege: false
  read_only: false
  note: "stress / stress-ng: saturates CPU/memory/IO that other processes and agents on the host also draw on, so shared, not local"

# --- deploy ---
- id: deploy_trigger
  match: {family: deploy, sub: null, flags_any: []}
  reversible: false
  scope: shared
  privilege: false
  read_only: false
  note: "deploy script / deploy tool call"

# --- fallback ---
- id: unknown
  match: {family: unknown, sub: null, flags_any: []}
  reversible: false
  scope: shared
  privilege: false
  read_only: false
  note: "unrecognized command; conservative default"
