[project]
name = "kosha"
version = "0.0.1"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml", "fastapi", "uvicorn", "requests", "watchdog", "bashlex", "mcp"]

[project.scripts]
koshad = "kosha.api.server:main"
kosha-mcp = "kosha.adapters.bob_mcp:main"
kosha-hook = "kosha.adapters.claude_hook:main"
kosha-install = "kosha.adapters.install:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kosha*"]

[tool.setuptools.package-data]
kosha = ["api/ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
